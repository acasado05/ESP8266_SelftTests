; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ─── Configuración del Monitor Serie ───
monitor_speed = 115200
upload_port = COM13      ; Cambia al puerto real de tu ESP32-S3
monitor_port = COM13
monitor_rts = 0
monitor_dtr = 0

; ─── Optimización de Memoria Flash para el S3 ───
board_build.arduino.memory_type = qio_qspi 
board_build.flash_mode = qio

; ─── Flags de Compilación (Crucial para el USB nativo) ───
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; ─── Dependencias y Librerías ───
lib_deps = 
    ; Librería de TensorFlow Lite Micro oficial mantenida para ESP32
    tanakamasayuki/TensorFlowLite_ESP32
