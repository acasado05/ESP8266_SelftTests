[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_port = COM14
monitor_port = COM14

board_build.arduino.memory_type = qio_qspi 
board_build.flash_mode = qio

monitor_rts = 0
monitor_dtr = 0

build_flags = 
    -D ARDUINO_USB_CDC_ON_BOOT=0

           